name: Generated code

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  generate:
    name: "Generated code is up to date"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4

      - name: "Install PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: "Install composer dependencies"
        run: composer install --prefer-dist --no-progress

      - name: "Generate the SDK"
        run: composer generate

      - name: "Check that src/ matches the generation"
        run: |
          if [ -n "$(git status --porcelain -- src)" ]; then
            echo "::error::The generated code in src/ is not up to date or was edited manually. Run 'composer generate' and commit the result."
            git status --short -- src
            git diff --stat -- src
            exit 1
          fi
