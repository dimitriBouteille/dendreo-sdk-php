                  description: "L'entreprise cliente : obligatoire en INTRA et hors formation, où elle ne peut pas être vidée, et refusée en INTER. Doit être accessible dans le centre de formation de l'ADF. Si l'ADF a des participants inscrits, seule une entreprise du même groupe est acceptée. Sans `id_contact` dans la même requête, un contact qui n'appartient pas à la nouvelle entreprise est retiré de l'ADF, et l'ancienne entreprise est détachée si elle n'a plus de participant inscrit. Peut être désignée autrement par `entreprise_raison_sociale`, `entreprise_id_externe` ou `entreprise_siret`."
