                numero_complet:
                  type: string
                  description: "Le numéro affiché de l'ADF. Incompatible avec `numero`. Max : 50 caractères."
                  example: ADF_2025001
                  nullable: true
                numero:
                  type: integer
                  description: 'Le numéro interne (entier > 0). Incompatible avec `numero_complet`. Min : 1. Max : 2147483647.'
                  example: 42
                  nullable: true
                id_entreprise:
                  type: integer
                  description: "L'entreprise cliente : obligatoire en INTRA et hors formation, refusée en INTER. Doit être accessible dans le centre de formation de l'ADF. Peut être désignée autrement par `entreprise_raison_sociale`, `entreprise_id_externe` ou `entreprise_siret`."
                  example: 1
                  nullable: true
                entreprise_raison_sociale:
                  type: string
                  description: "Désigne l'entreprise par sa raison sociale exacte ; si plusieurs entreprises la portent, la première est retenue. Max : 191 caractères."
                  example: 'ACME Formation'
                  nullable: true
                entreprise_id_externe:
                  type: string
                  description: "Désigne l'entreprise par son identifiant externe exact. Alias V1 : `id_externe_entreprise`. Max : 36 caractères."
                  example: ext_123
                  nullable: true
                entreprise_siret:
                  type: string
                  description: "Désigne l'entreprise par son SIRET exact ; si plusieurs entreprises le portent, la première est retenue. Max : 30 caractères."
                  example: '73282932000074'
                  nullable: true
                id_contact:
                  type: integer
                  description: "Le contact de l'entreprise cliente. Refusé en INTER, s'il n'appartient pas à l'entreprise de l'ADF ou s'il est désactivé."
                  example: 12
                  nullable: true
                salle_client:
                  type: boolean
                  description: "Crée (ou réutilise) une salle « chez le client » et l'attache à l'ADF. Accepté seulement avec `type` = `intra`, et jamais avec `id_salle_de_formation` ou `id_externe_salle_de_formation`."
                  example: true
                  nullable: true
