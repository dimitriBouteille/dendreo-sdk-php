        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: '`inter`, `intra` ou `hors_formation` (option multi-produits requise). Voir la rubrique « Type et entreprise ».'
                  example: intra
                  enum:
                    - inter
                    - intra
                    - hors_formation
                id_centre_de_formation:
                  type: integer
                  description: "Le centre de formation de l'ADF."
                  example: 1
