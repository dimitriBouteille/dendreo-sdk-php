  /v2/catalogue-prochaines-sessions:
    get:
      summary: 'Lister les prochaines sessions du catalogue public'
      operationId: catalogue-prochaines-sessions.index
      description: "Retourne les prochaines sessions visibles sur le Catalogue public, triées par date de début (tri par défaut). Les modules simples et les Modules Composés programmés sur une action de formation sont mélangés dans la même liste : le couple `type_module` + `id` identifie une ligne. Les sessions permanentes ne sont pas retournées.\n\n**Règles de visibilité**\n\nElles sont celles du Catalogue public et ne peuvent pas être désactivées. Une session n'est listée que si :\n\n- son module est dans le catalogue, a une catégorie, appartient à la catégorie de produit « formation », n'est pas supprimé et n'est pas à visibilité restreinte ;\n- son action de formation est visible sur le catalogue, avec l'inscription en ligne activée, et son étape de process est configurée pour s'afficher sur le catalogue ;\n- sa date de début n'est pas passée, et elle démarre au moins le nombre de jours du délai « empêcher l'inscription » du centre avant son début ;\n- elle n'est pas en mode `stage` ;\n- elle est de type INTER, ou INTRA si le centre affiche les INTRA sur son catalogue et, pour une INTRA rattachée à une entreprise, si le centre l'autorise aussi ;\n- elle n'est pas en e-learning asynchrone, sauf si le centre affiche ce mode sur son catalogue. Une session en e-learning asynchrone déjà commencée n'est listée que si le centre autorise l'inscription aux e-learning asynchrones en cours.\n\nUne session dont le module est supprimé n'est jamais listée, quel que soit le réglage d'affichage des INTRA.\n\n**Filtre de centre**\n\nSans `filter[id_centre_de_formation]`, la liste est celle du Catalogue public global, avec les réglages globaux ; en multi-centre, seuls les centres choisis pour le catalogue global sont concernés. Avec `filter[id_centre_de_formation]`, la liste est celle du catalogue de ce centre, avec les réglages de ce centre.\n\n**Différences avec l'API V1** (`catalogue_prochaines_sessions`)\n\n- Paramètres : `limit` est remplacé par `per_page` et `page` (100 résultats maximum par page) ; `id_centre_de_formation`, `id_module` et `id_categorie` passent en `filter[...]` ; `show_inter_only=true` est remplacé par `filter[type]=inter`, qui exclut toutes les INTRA (la V1 ne retirait que les INTRA sans entreprise).\n- Visibilité : les modules à visibilité restreinte sont exclus ; en multi-centre sans filtre de centre, seuls les centres du catalogue global sont listés (la V1 renvoyait tous les centres) ; `satisfaction` vaut `null` quand la satisfaction est désactivée ou que le catalogue appelé masque la note moyenne : réglage du catalogue global sans filtre de centre, réglage du centre avec `filter[id_centre_de_formation]`.\n- Format : les valeurs sont typées (entiers, décimaux, `null` au lieu des chaînes vides, y compris dans `lieux`) ; `mode_organisation` porte la clé technique et le libellé passe dans `mode_organisation_libelle`, avec le libellé du Catalogue public (« Présentiel / à distance » là où la V1 renvoyait « Mixte ») ; `id_lam` n'est plus renvoyé : l'identifiant de la session est dans `id`, à lire avec `type_module` (pour un module simple, c'est l'ancien `id_lam`) ; `categorie` reste l'intitulé de la catégorie, l'objet catégorie est dans `categorie_module` (include) ; `module_champs_additionnels` est toujours présent (objet vide sans champ additionnel) ; `slug`, `slug_categorie` et `slug_relatif`, qui contiennent des URL, sont renommés `url`, `url_categorie` et `url_relative` ; `url_categorie` vaut `null` quand l'URL du catalogue du centre manque.\n- Corrections : un module simple et un Module Composé de même identifiant ne s'écrasent plus, et la pagination porte sur la liste fusionnée ; `remplissage` et `url_relative` d'un Module Composé sont calculés comme pour un module simple.\n- Créneaux : les clés `salle` et `formateurs` remplacent `salledeformation` et `formateurs_staffes`, et `salle` a le même format que les éléments de `lieux` ; les créneaux d'un Module Composé sont triés par date de début et portent `day` comme ceux d'un module simple ; `url_connexion` et `url_connexion_invite` sont toujours présentes et valent `null` hors salle Whereby dotée d'une salle virtuelle ; les clés d'audit sont `created_at`, `id_add`, `updated_at` et `id_edit` au lieu de `date_add` et `date_edit` ; `include=creneaux.salle` (et chaque sous-include) suffit seul, sans `creneaux`."
      parameters:
        -
          in: query
          name: 'filter[id]'
          description: 'Identifiant de la session. Entiers séparés par des virgules : une valeur non entière, seule ou dans une liste, ne retourne aucune session.'
          required: false
          schema:
            type: array
            description: 'Identifiant de la session. Entiers séparés par des virgules : une valeur non entière, seule ou dans une liste, ne retourne aucune session.'
            items:
              type: integer
          style: form
          explode: false
        -
          in: query
          name: 'filter[id_centre_de_formation]'
          description: "Limite la liste au catalogue public de ce centre, avec les réglages du centre. `0` ou absent : catalogue public global. Un seul identifiant est accepté. Le mot de passe du catalogue de ce centre et l'absence de catalogue pour ce centre sont ignorés."
          example: 3
          required: false
          schema:
            type: integer
            description: "Limite la liste au catalogue public de ce centre, avec les réglages du centre. `0` ou absent : catalogue public global. Un seul identifiant est accepté. Le mot de passe du catalogue de ce centre et l'absence de catalogue pour ce centre sont ignorés."
            example: 3
        -
          in: query
          name: 'filter[id_module]'
          description: 'Identifiant du module. Entiers séparés par des virgules : une valeur non entière, seule ou dans une liste, ne retourne aucune session.'
