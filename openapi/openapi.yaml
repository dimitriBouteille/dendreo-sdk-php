    post:
      summary: 'Créer une action de formation'
      operationId: actions-de-formation.store
      description: "Les règles propres à un seul champ figurent dans la liste des paramètres ; celles ci-dessous combinent plusieurs champs. Une règle non respectée renvoie 422.\n\n### Type et entreprise\n- `inter` : aucune entreprise ni aucun contact ne peut être lié, et `mode_pricing` vaut toujours `par_participant`.\n- `intra` : une entreprise est obligatoire. Avec un module hors formation et l'option multi-produits, l'ADF créée est hors formation.\n- `hors_formation` : ADF INTRA dont aucun module n'est un module de formation. Elle exige l'option multi-produits et une entreprise. `id_module` reste facultatif, mais doit désigner un module hors formation. Elle prend les étapes du process INTRA. En lecture, `type` vaut `hors_formation` quand `formation` vaut `false`.\n- L'entreprise se désigne par l'un de ces champs, lus dans cet ordre de priorité : `id_entreprise`, `entreprise_raison_sociale`, `entreprise_id_externe` (ou son alias `id_externe_entreprise`), `entreprise_siret`. Une entreprise introuvable ou désactivée est refusée.\n\n### Ajouter un module\n- `id_module` ou `id_externe_module` ajoute un module à l'ADF.\n- `intitule`, `objectif` et `include_in_bpf` reprennent les valeurs du module quand ils ne sont pas envoyés.\n- `prix`, `duree`, `date_debut`, `date_fin`, `date_acces_debut` et `date_acces_fin` s'appliquent au module ajouté : ils sont refusés sans module.\n- `id_formateur` (ou `id_externe_formateur`) et `id_entreprise_formateur` staffent le formateur sur le module ajouté. Sans module, ils sont validés mais ignorés.\n- Si le module a un formateur, un formateur sous-traitant ou une salle par défaut, `id_formateur`, `id_entreprise_formateur` et `id_salle_de_formation` les remplacent au lieu de s'y ajouter : le module n'a jamais deux formateurs ni deux formateurs sous-traitants.\n\n### Dates\n- Sans module, l'ADF est créée sans dates. Ses dates sont ensuite calculées à partir de ses modules.\n- Avec un module, `date_debut` est obligatoire et `date_fin` facultative.\n- Module hors formation sans dates : `date_debut` devient facultative.\n- Module hors formation avec l'option « Produit ayant des dates », sauf e-learning asynchrone : `date_fin` devient obligatoire.\n- ADF en mode figé (`has_dates_contractuelles` envoyé, sinon réglage du centre de formation) : `date_debut` et `date_fin` sont obligatoires, sauf pour un module hors formation sans dates ou e-learning asynchrone (où seule `date_debut` reste obligatoire).\n\n### Salle et numéro\n- `salle_client` n'est accepté qu'avec `type` = `intra`, jamais avec `id_salle_de_formation` ou `id_externe_salle_de_formation`.\n- `numero_complet` et `numero` : l'un ou l'autre, jamais les deux."
