          description: 'Suppression effectuée'
          content:
            application/json:
              schema:
                type: object
                nullable: true
        401:
          description: 'Clé API invalide'
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ApiKeyError'
                  -
                    $ref: '#/components/schemas/UnauthenticatedError'
              examples:
                invalid_key:
                  summary: 'Clé API invalide ou révoquée'
                  value:
                    status: failure
                    errors:
