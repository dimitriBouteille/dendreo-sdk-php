          description: 'Filtre les salles internes (`1`) ou externes (`0`).'
          example:
            - 1
          required: false
          schema:
            type: array
            description: 'Filtre les salles internes (`1`) ou externes (`0`).'
            items:
              type: integer
              enum:
                - 0
                - 1
          style: form
          explode: false
        -
          in: query
