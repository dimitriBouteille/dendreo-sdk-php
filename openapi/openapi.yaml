openapi: 3.0.3
info:
  title: 'Dendreo - Documentation API'
  description: 'Cette documentation a pour but de fournir toutes les informations dont vous aurez besoin pour utiliser notre API.'
  version: 1.0.0
servers:
  -
    url: 'https://api.dendreo.com'
tags:
  -
    name: 'Actions commerciales'
    description: ''
  -
    name: 'Actions de Formation'
    description: "Les champs OGDPC (`num_session_dpc`, `ogdpc_orientation`…) ne sont renvoyés que si l'option OGDPC est active sur le centre de formation de l'ADF, et les champs LMS (`dokeos_*`, `tslearning_group_id`, `riseup_*`) que si le LMS correspondant est activé.\n\n### Règles de saisie\n- Les champs additionnels de type date s'écrivent et se lisent au format `YYYY-MM-DD`, sans partie horaire."
  -
    name: Administrateurs
    description: ''
  -
    name: Budgets
    description: '<div class="sl-font-prose sl-font-semibold sl-px-1.5 sl-rounded-lg sl-text-on-primary sl-w-max" style="background-color: darkred;">Ces endpoints sont en cours de développement</div>'
  -
    name: 'Catégories de Module'
    description: ''
  -
    name: 'Centres de formation'
    description: 'La liste ne renvoie jamais le centre Global (`0`), même avec `filter[id]=0`. `GET /0` le renvoie, sans clé `id`.'
  -
    name: Entreprises
    description: ''
  -
    name: Financeurs
    description: ''
  -
    name: Opportunités
    description: ''
  -
    name: Participants
    description: "Le bloc extranet (`message_extranet`, `extranet_url`, `extranet_code`, `extranet_autologin_url`) n'est renvoyé que si le participant a un accès extranet. Les identifiants LMS (`*_user_id`) ne sont renvoyés que pour les LMS activés sur le compte, et les champs OGDPC que si l'option OGDPC est active.\n\n### Règles de saisie\n- **ogdpc_adeli**, **ogdpc_rpps**, **ogdpc_id_specialite** et **mode_dexercice_dominant** ne sont pris en compte que si l'option OGDPC est active ; sinon ils sont ignorés.\n- **ogdpc_id_specialite** : identifiant ou intitulé exact de la spécialité DPC ; une spécialité inconnue renvoie 422.\n- **mode_dexercice_dominant** : `salarie`, `liberal`, `mixte`, `armee` ou `centre_conv`."
  -
    name: 'Salles de formation'
    description: "Une salle est interne (dans un centre de formation), externe (adresse libre), virtuelle (e-learning) ou chez le client (dans une entreprise, ou à l'extérieur pour son compte). `emplacement_cible` donne ce type et `emplacement_id` la référence associée : l'identifiant du centre pour une salle interne, celui de l'entreprise pour une salle chez le client.\n\n### Règles de saisie\n- Changer `emplacement_cible` vide les champs sans objet pour le nouveau type : `url_connexion` pour une salle interne, externe ou chez le client ; `adresse`, `code_postal`, `ville` et `pays_alpha2` pour une salle interne, virtuelle ou dans l'entreprise ; `lien_google_maps` pour une salle virtuelle.\n- Une salle interne reprend le nom du contact, le téléphone et le lien Google Maps de son centre : passer en `interne` vide `nom_contact`, `telephone` et `lien_google_maps`, et ces champs sont ignorés sur une salle déjà interne.\n- En multi-centres, l'entreprise d'une salle chez le client doit être visible dans au moins un des centres de `id_centre_de_formation`, sauf si elle est visible dans tous les centres.\n- `id_centre_de_formation` remplace la visibilité de la salle par les centres envoyés ; vide, la salle est visible dans tous les centres.\n- `lien_google_maps` est normalisé et `url_connexion` est complétée en `https://` si le protocole manque."
  -
    name: 'Sessions permanentes'
    description: "### Règles de saisie\n- La durée s'exprime en heures via `duree_heures`, en entrée comme en sortie.\n- Sans durée propre, la session hérite de la durée du module ; `duree_heures: null` restaure cet héritage."
  -
    name: 'Types de produit'
    description: ''
  -
    name: Tâches
    description: "Raccourci en **lecture seule** : pour un ou plusieurs Participants, remonte en un seul appel l'ensemble de leurs tâches extranet en attente — émargements électroniques, documents à signer, questionnaires de satisfaction et auto-positionnements. Cet endpoint ne supporte ni `include` ni `sort`.\n\n`data` est toujours un tableau, y compris pour un seul Participant, et `taches` aussi (vide si rien n'est en attente). `counts` ne contient que les catégories demandées via `types` ; la catégorie `satisfaction` en est absente lorsque la satisfaction est désactivée sur l'organisme, même si `types` la demande. Le délai d'émargement est celui du centre de formation de l'action de formation, à défaut celui de la configuration globale. Un document à signer hors action de formation a `id_action_de_formation` à `null`."
  -
    name: 'Étapes ADF'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "Dendreo vous permet de configurer plusieurs clés d'accès pour votre API depuis <a href=\"https://pro.dendreo.com/redirect/api\" target=\"_blank\">la page de configuration</a>.<br>Cela peut vous être utile notamment si plusieurs entités et services utilisent votre API.\n\n## Erreurs d'authentification\n\nSi aucune clé API n'est transmise, l'API répond avec un statut 401 sous cette forme :\n\n```json\n{\n    \"error\": \"Unauthenticated.\"\n}\n```\n\nSi la clé transmise est invalide ou révoquée, l'API répond avec un statut 401 sous une forme différente :\n\n```json\n{\n    \"status\": \"failure\",\n    \"errors\": [\n        \"...\"\n    ]\n}\n```\n\nSi le header `of` est absent, l'API répond avec un statut 400 :\n\n```json\n{\n    \"code\": 400,\n    \"message\": \"Merci de renseigner le header \\\"of\\\" pour vos appels API.\"\n}\n```\n\nSi le header `of` ne correspond à aucun organisme de formation, l'API répond avec un statut 404 :\n\n```json\n{\n    \"code\": 404,\n    \"message\": \"Aucun organisme de formation ne correspond au header \\\"of\\\" fourni.\"\n}\n```\n\n# Includes\n\nSur les requêtes **GET**, le champ `include` permet de charger des relations en plus de la ressource principale.\n\nExemple : `?include=commerciaux` ou `?include=commerciaux,formateurs`\n\nLes valeurs autorisées sont listées dans le paramètre `include` de chaque endpoint. Une valeur non autorisée répond 400.\n\n# Filtres\n\nSur les requêtes **GET**, le champ `filter` permet de filtrer les résultats selon des critères spécifiques. Les filtres suivent la spécification JSON API.\n\n## Syntaxe générale\n\n```\n?filter[champ]=valeur\n```\n\n## Types de filtres disponibles\n\n### Filtres partiels\nRecherche les enregistrements contenant la valeur fournie.\n\nExemple : `?filter[nom]=Jean` trouvera \"Jean Dupont\", \"Jean-Paul\", etc.\n\n### Filtres multiples\nVous pouvez appliquer plusieurs filtres simultanément.\n\nExemple : `?filter[nom]=Jean&filter[statut]=actif`\n\n### Filtres de date\nLes champs `created_at` et `updated_at` sont disponibles sur toutes les ressources qui possèdent des timestamps.\n\n**Recherche par préfixe** sans opérateur :\n\n```\n?filter[created_at] = 2024-01\n```\n\n**Avec opérateur** préfixez la valeur avec `>=`, `<=`, `>`, `<`, `=` ou `<>` :\n\n```\n?filter[created_at] = >=2024-01-01\n?filter[updated_at] = <=2025-01-01\n```\n\n**Plage de dates** passez un tableau de valeurs :\n\n```\n?filter[created_at][] = >=2024-01-01&filter[created_at][] = <=2024-12-31\n```\n\n## Valeurs ignorées\n\nLes valeurs suivantes sont automatiquement ignorées dans les filtres :\n- `null`\n- `\"\"` (chaîne vide)\n- `[]` (tableau vide)\n\n## Combinaison avec d'autres paramètres\n\nLes filtres peuvent être combinés avec les autres paramètres de requête :\n\n```\n?filter[nom]=Jean&include=commerciaux&per_page=25\n```\n\nLes filtres autorisés sont listés dans les paramètres `filter[…]` de chaque liste. Un filtre non autorisé répond 400.\n\n# Tri\n\nSur les requêtes **GET**, le champ `sort` trie la liste selon l'une des valeurs listées dans le paramètre `sort` de chaque liste. Préfixer la valeur par `-` inverse l'ordre. Une valeur non autorisée répond 400 :\n\n```\n?sort=-created_at\n```\n\n# Pagination\n\nLes listes sont paginées par 15 résultats par défaut. Le paramètre `per_page` permet de choisir une autre taille de page, jusqu'à 100 résultats. Une valeur qui n'est pas un nombre entier positif est ignorée : la taille par défaut s'applique.\n\nLes liens `links.first`, `links.prev` et `links.next` de la réponse reprennent les paramètres de votre requête (`per_page`, `filter`, `sort`, `include`) : suivez `links.next` jusqu'à ce qu'il vaille `null` pour parcourir tous les résultats.\n\n# Traçabilité\n\nLes ressources retournées par l'API incluent automatiquement des champs de traçabilité qui permettent de connaître l'historique des modifications.\n\n## Champs de base\n\nToutes les ressources incluent ces champs temporels :\n\n- `created_at` : Date et heure de création de la ressource\n- `updated_at` : Date et heure de la dernière modification\n- `deleted_at` : Date et heure de suppression (si la ressource supporte la suppression logique)\n\n## Champs d'audit avancés\n\nPour certaines ressources, des informations supplémentaires sur l'auteur des actions sont disponibles :\n\n### Informations sur les administrateurs\n\n- `administrateur_add` : Détails de l'administrateur qui a créé la ressource\n- `administrateur_edit` : Détails de l'administrateur qui a effectué la dernière modification  \n- `administrateur_delete` : Détails de l'administrateur qui a supprimé la ressource\n\n### Inclusion des informations d'audit\n\nPour accéder aux informations détaillées des administrateurs, utilisez le paramètre `include` :\n\n```\n?include=administrateurAdd,administrateurEdit,administrateurDelete\n```\n\n### Exemple de réponse\n\n```json\n{\n  \"id\": 123,\n  \"nom\": \"Formation Excel\",\n  \"created_at\": \"2024-01-15 10:30:00\",\n  \"updated_at\": \"2024-01-20 14:45:00\",\n  \"deleted_at\": null,\n  \"administrateur_add\": {\n    \"id\": 5,\n    \"nom\": \"Martin\",\n    \"prenom\": \"Pierre\"\n  },\n  \"administrateur_edit\": {\n    \"id\": 8,\n    \"nom\": \"Dubois\", \n    \"prenom\": \"Marie\"\n  }\n}\n```\n\n**Note** : Ces champs sont automatiquement inclus dans les réponses et ne nécessitent aucune configuration particulière côté client.\n\n\n# Erreurs\n\nQuand des attributs sont validés par l'API (présence, format, existence), si aucune erreur n'est détectée, un statut 200 (Success), 201 (Created) ou 204 (Deleted) sera retourné par l'API.\n\nDans le cas contraire, un statut 422 (Unprocessable Entity) sera retourné accompagné des messages d'erreurs associés aux validations qui ont échouée.\n\n```json\n{\n\t\"message\": \"Cet email est déjà utilisé.\",\n\t\"errors\": {\n\t\t\"email\": [\n\t\t\t\"Cet email est déjà utilisé.\"\n\t\t]\n\t}\n}\n```\n\n# Limites de débit\n\nL'API de Dendreo impose les limites suivantes :\n\n**Burst** : 100 requêtes max par période de 10 secondes\n\n**Mensuelle** : dépend de votre niveau d'abonnement\n\n**Quotidienne** : 100 000 requêtes max par jour, quel que soit votre limite mensuelle\n\nEn cas de dépassement, vous recevrez une erreur `429 - HTTP_TOO_MANY_REQUESTS`.\n"
    of:
      type: apiKey
      in: header
      name: of
      description: "Identifiant de votre compte, celui qui suit `pro.dendreo.com/` dans l'adresse de votre espace."
