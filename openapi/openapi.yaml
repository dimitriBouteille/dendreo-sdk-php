      summary: 'Mettre à jour une action de formation'
      operationId: actions-de-formation.update
      description: "Seuls les champs envoyés sont modifiés. Un champ envoyé à `\"\"` ou `null` est vidé, sauf si sa description précise qu'il ne peut pas l'être. Les règles de validation de la création s'appliquent, avec les différences ci-dessous et celles indiquées champ par champ. Une règle non respectée renvoie 422.\n\n### Ajouter un module\n- `id_module` ou `id_externe_module` ajoute un module à l'ADF ; un module déjà présent ne se modifie pas avec cet endpoint.\n- `date_debut`, `date_fin`, `prix`, `duree`, `date_acces_debut` et `date_acces_fin` s'appliquent au module ajouté : ils sont refusés sans `id_module` dans la même requête.\n- Les dates obligatoires sont celles de la création. Le mode figé se lit sur `has_dates_contractuelles` s'il est envoyé, sinon sur l'ADF.\n- Les dates de l'ADF sont recalculées à partir de ses modules.\n\n### Champs réservés à la création\n- `type` et `mode_pricing`.\n- `salle_client`.\n- `id_formateur`, `id_externe_formateur` (alias V1 `formateur_id_externe`) et `id_entreprise_formateur` : le formateur se staffe sur le module ajouté à la création.\n\n### ADF supprimée ou inconnue\n- ADF supprimée : 404 avec le message `L'ADF est désactivée.`. La restaurer d'abord avec `POST /{id}/restore`.\n- ADF inconnue : 404 avec le message `Entité non trouvée.`."
