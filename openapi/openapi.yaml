            items:
              type: integer
          style: form
          explode: false
        -
          in: query
          name: 'filter[id_action_de_formation]'
          description: "Identifiant de l'action de formation. Entiers séparés par des virgules : une valeur non entière, seule ou dans une liste, ne retourne aucune session."
          required: false
